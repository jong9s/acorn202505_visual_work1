<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Step14_promise3.html</title>
  </head>
  <body>
    <h3>이미지를 선택하세요</h3>
    <input type="file" id="fileInput" accept="image/*" multiple />
    <div id="preview"></div>
    <script>
      // FileReader 를 Promise 로 감싸는 함수
      function readFile(file) {
        const promise = new Promise((resolve) => {
          // 이 안에서 비동기 동작을 하고 동작이 완료되면 resolve() 함수를 호출한다.
          // 호출하면서 필요시 매개변수에 동작의 결과 데이터를 전달할 수도 있다.
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = () => {
            // resolve() 함수 호출하면서 읽은 결과 데이터 전달
            resolve(reader.result);
          };
        });
        return promise;
      }

      document.querySelector("#fileInput").addEventListener("change", (e) => {
        // e 는 발생한 이벤트에 대한 정보를 담고있는 event object
        // e.target 에는 "change" 이벤트가 발생한 바로 그 요소(input요소)의 참조값이 들어있다.
        // e.target.files 는 선택된 파일 객체가 들어있는 파일 배열이다.
        const files = e.target.files;
        // Promise 객체를 리턴해주는  readFile() 함수를 호출하면서 file 객체 전달
        readFile(files[0])
        .then((data) => {
          // data 는 읽은 이미지의 DataURL 이다
          const img = `<img src = "${data}">`;
          document.querySelector("#preview").insertAdjacentHTML("beforeend", img);
          // 두번째 Promise 객체를 리턴해준다.
          return readFile(files[1]);
        })
        .then((data)=>{
          const img = `<img src = "${data}">`;
          document.querySelector("#preview").insertAdjacentHTML("beforeend", img);
        })
        .catch(err=>{
          // 여기는 Promise 가 reject 되거나 Error 가 발생하면 실행되는 영역
          console.log(err);
        })
        
      });
    </script>
  </body>
</html>
