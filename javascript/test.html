<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>test.html</title>
  </head>
  <body>
    <script>
      const test = new Promise((resolve, reject)=>{
          let success = true;

          if (success) {
              resolve("작업 성공");
          } else {
              reject("작업 실패");
          }
      });

      test
      .then(result => {
          console.log("결과: ", result);
      })
      .catch(error => {
          console.log("에러: ", error);
      });
    </script>
  </body>
</html>
