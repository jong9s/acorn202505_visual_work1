<body>
    <script>
        const names = ["김구라", "해골"];
        // ... spread 연산자를 이용해서 배열에 저장된 내용을 새로운 배열에 펼쳐놓고 아이템이 추가된 배열을 얻어낼 수 있다.
        const names2 = [...names, "서종훈"];

        const mem1 = {num: 1, name: "서종훈"};
        // object 도 spread 연산자를 사용할 수 있다.
        const mem2 = {...mem1, addr: "구리시"};
        const mem3 = {
            ...mem1,
            addr: "노량진",
            isMan: true
        };
        const mem4 = {
            ...mem3,
            name: "김구라"
        }; // name: "서종훈" -> name: "김구라" 로 변경된다
    </script>
</body>
